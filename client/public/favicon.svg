<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Cat head -->
  <circle cx="24" cy="28" r="14" fill="#c0a060"/>
  <!-- Left ear -->
  <polygon points="12,20 10,6 18,16" fill="#c0a060"/>
  <!-- Right ear -->
  <polygon points="36,20 38,6 30,16" fill="#c0a060"/>
  <!-- Inner left ear -->
  <polygon points="13,19 12,9 17,16" fill="#e8c88a"/>
  <!-- Inner right ear -->
  <polygon points="35,19 36,9 31,16" fill="#e8c88a"/>
  <!-- Eyes -->
  <ellipse cx="18" cy="26" rx="2.5" ry="3" fill="#1a1a1a"/>
  <ellipse cx="30" cy="26" rx="2.5" ry="3" fill="#1a1a1a"/>
  <!-- Eye shine -->
  <circle cx="19" cy="25" r="1" fill="white"/>
  <circle cx="31" cy="25" r="1" fill="white"/>
  <!-- Nose -->
  <polygon points="24,30 22,32 26,32" fill="#e88"/>
  <!-- Mouth -->
  <path d="M22 33 Q24 35 26 33" stroke="#8B7355" fill="none" stroke-width="1"/>
  <!-- Headphones band -->
  <path d="M8 22 Q8 4 24 4 Q40 4 40 22" stroke="#8B7355" fill="none" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Left headphone cup -->
  <rect x="4" y="20" rx="4" ry="4" width="7" height="10" fill="#8B7355"/>
  <!-- Right headphone cup -->
  <rect x="37" y="20" rx="4" ry="4" width="7" height="10" fill="#8B7355"/>
  <!-- Whiskers -->
    <line x1="12" y1="30" x2="5" y2="28" stroke="#8B7355" stroke-width="1"/>
    <line x1="12" y1="32" x2="5" y2="34" stroke="#8B7355" stroke-width="1"/>
    <line x1="36" y1="30" x2="43" y2="28" stroke="#8B7355" stroke-width="1"/>
    <line x1="36" y1="32" x2="43" y2="34" stroke="#8B7355" stroke-width="1"/>
  </svg>