# Wojo Music - Render Deployment Configuration

services:
  - type: web
    name: wojomusic
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: cd server && node index.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: CLIENT_URL
        value: https://wojomusic.onrender.com
      - key: PORT
        value: "10000"
    # Render will set PORT to 10000 automatically; this is just a fallback