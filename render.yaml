# Wojo Music - Render Deployment Configuration

services:
  - type: web
    name: wojomusic
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: cd server && node index.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: CLIENT_URL
        value: https://wojomusic.onrender.com
      - key: PORT
        value: "10000"
    # Render will set PORT to 10000 automatically; this is just a fallback
      - key: YT_DEBUG
        value: "1"
      - key: YT_SESSION_FILE
        value: /tmp/.yt-session.json
    # YT_SESSION_FILE: the PoToken identity { visitorData, sessionToken } is
    # persisted here so restarts within the same Render instance reuse the
    # attested identity instead of minting a new one on every boot. Render's
    # disk is ephemeral across deploys, so a fresh identity is bootstrapped
    # per deploy — that is expected and handled by the rotation logic.
    # YT_DEBUG_KEY: optional secret to protect /api/yt-debug (e.g. set it in
    # the Render dashboard; leave unset to allow open access during debugging).
